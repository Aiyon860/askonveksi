<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Askonveksi</title>
  <script src="assets/gsap.min.js"></script>
  <script src="assets/music/audio-data.js"></script>
  <style>
    @font-face {
      font-family: Inter;
      src: url("assets/fonts/Inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }

    html, body {
      margin: 0;
      background: #eff3f7;
    }

    [data-composition-id="brag"] {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #eff3f7;
      color: #0a0a0a;
      font-family: Inter, Arial, sans-serif;
    }

    #grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgb(67 45 215 / 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgb(67 45 215 / 0.05) 1px, transparent 1px);
      background-size: 84px 84px;
      pointer-events: none;
    }

    #glow {
      position: absolute;
      left: -180px;
      top: -240px;
      width: 880px;
      height: 880px;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(0 83 194 / 0.22) 0%, rgb(0 83 194 / 0) 70%);
      pointer-events: none;
      transform-origin: center center;
    }

    .scene {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 88px 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }

    #s2, #s3, #s4 { opacity: 0; }

    .kicker {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #0053c2;
    }

    .title {
      margin: 0;
      font-size: 84px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .page-title {
      margin: 0;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .bubble {
      width: 760px;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 28px 32px 32px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #ffffff;
    }

    .bubble-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 650;
      color: #0a0a0a;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #25d366;
    }

    .bubble p {
      margin: 16px 0 0;
      font-size: 40px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .board {
      position: relative;
      width: 1680px;
      height: 560px;
    }

    .cols {
      display: grid;
      height: 100%;
      gap: 24px;
    }

    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }

    .col {
      box-sizing: border-box;
      height: 100%;
      padding: 22px 24px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #ffffff;
    }

    .col-label {
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: #0a0a0a;
    }

    .card {
      position: absolute;
      top: 84px;
      left: 20px;
      box-sizing: border-box;
      padding: 22px 24px 24px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #f5f5f5;
    }

    #s2-card { width: 504px; }
    #s3-card { width: 362px; }

    .card-kicker {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5d5d5d;
    }

    .card-title {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-qty {
      margin-top: 14px;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: #0053c2;
    }

    #s4 {
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .eyebrow {
      margin: 0;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #0053c2;
    }

    .wordmark {
      margin: 8px 0 12px;
      font-size: 108px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .lockup {
      margin: 0;
      font-size: 54px;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="brag"
    data-start="0"
    data-duration="21"
    data-width="1920"
    data-height="1080"
  >
    <audio id="music" data-start="0" data-duration="21" data-track-index="0" data-volume="0.34" src="assets/music/bed.mp3"></audio>
    <audio id="sfx-bubble" data-start="0.72" data-duration="0.01" data-track-index="1" data-volume="0.45" src="assets/sfx/interface/click_003.ogg"></audio>
    <audio id="sfx-step-1" data-start="6.82" data-duration="0.06" data-track-index="1" data-volume="0.4" src="assets/sfx/ui/rollover2.ogg"></audio>
    <audio id="sfx-step-2" data-start="8.22" data-duration="0.06" data-track-index="1" data-volume="0.4" src="assets/sfx/ui/rollover2.ogg"></audio>
    <audio id="sfx-step-3" data-start="11.47" data-duration="0.06" data-track-index="1" data-volume="0.4" src="assets/sfx/ui/rollover2.ogg"></audio>
    <audio id="sfx-step-4" data-start="12.56" data-duration="0.06" data-track-index="1" data-volume="0.4" src="assets/sfx/ui/rollover2.ogg"></audio>
    <audio id="sfx-step-5" data-start="13.64" data-duration="0.06" data-track-index="1" data-volume="0.4" src="assets/sfx/ui/rollover2.ogg"></audio>
    <audio id="sfx-done" data-start="15.82" data-duration="0.22" data-track-index="1" data-volume="0.5" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
    <audio id="sfx-mark" data-start="17.15" data-duration="0.16" data-track-index="1" data-volume="0.42" src="assets/sfx/interface/bong_001.ogg"></audio>

    <div id="grid" data-layout-ignore="true"></div>
    <div id="glow" data-layout-ignore="true"></div>

    <section id="s1" class="scene clip" data-start="0" data-duration="21" data-track-index="2">
      <p id="s1-kicker" class="kicker">Kotak Masuk</p>
      <h1 id="s1-title" class="title">Satu chat.</h1>
      <div id="s1-bubble" class="bubble">
        <div class="bubble-meta">
          <span class="dot" data-layout-ignore="true"></span>
          <span>WhatsApp</span>
        </div>
        <p>Butuh 120 seragam dinas.</p>
      </div>
    </section>

    <section id="s2" class="scene clip" data-start="0" data-duration="21" data-track-index="3">
      <p id="s2-kicker" class="kicker">CRM</p>
      <h2 id="s2-title" class="page-title">Pipeline</h2>
      <div class="board">
        <div class="cols cols-3">
          <div class="col" id="s2-c1"><div class="col-label">Follow Up</div></div>
          <div class="col" id="s2-c2"><div class="col-label">Negosiasi</div></div>
          <div class="col" id="s2-c3"><div class="col-label">Deal</div></div>
        </div>
        <article id="s2-card" class="card">
          <div class="card-kicker">Non-Jersey</div>
          <div class="card-title">Seragam Dinas</div>
          <div class="card-qty">120 pcs</div>
        </article>
      </div>
    </section>

    <section id="s3" class="scene clip" data-start="0" data-duration="21" data-track-index="4">
      <p id="s3-kicker" class="kicker">Proses Produksi Kami</p>
      <h2 id="s3-title" class="page-title">Produksi</h2>
      <div class="board">
        <div class="cols cols-4">
          <div class="col" id="s3-c1"><div class="col-label">Potong</div></div>
          <div class="col" id="s3-c2"><div class="col-label">Jahit</div></div>
          <div class="col" id="s3-c3"><div class="col-label">QC</div></div>
          <div class="col" id="s3-done"><div class="col-label" id="s3-done-label">Selesai</div></div>
        </div>
        <article id="s3-card" class="card">
          <div class="card-kicker">Non-Jersey</div>
          <div class="card-title">Seragam Dinas</div>
          <div class="card-qty">120 pcs</div>
        </article>
      </div>
    </section>

    <section id="s4" class="scene clip" data-start="0" data-duration="21" data-track-index="5">
      <p id="s4-eye" class="eyebrow">Konveksi di Semarang</p>
      <h2 id="s4-mark" class="wordmark">Askonveksi</h2>
      <p id="s4-line1" class="lockup">Dari Desain</p>
      <p id="s4-line2" class="lockup">Hingga Siap Pakai</p>
    </section>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    if (window.AUDIO_DATA) {
      const frames = window.AUDIO_DATA.frames;
      const fps = window.AUDIO_DATA.fps;
      const lastReactive = Math.floor(20.3 * fps);
      for (let f = 0; f < frames.length && f <= lastReactive; f++) {
        tl.call(
          ((frame) => () => {
            const bass = frame.bands[0];
            gsap.set("#glow", { scale: 1 + bass * 0.08, opacity: 0.4 + bass * 0.45 });
          })(frames[f]),
          [],
          f / fps,
        );
      }
    }

    tl.from("#s1-kicker", { y: 12, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.18);
    tl.from("#s1-title", { y: 36, opacity: 0, duration: 0.65, ease: "expo.out" }, 0.32);
    tl.from("#s1-bubble", { y: 28, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.72);

    tl.to("#grid", { backgroundPosition: "84px 0", duration: 21, ease: "none" }, 0);

    tl.to("#s1", { opacity: 0, filter: "blur(16px)", duration: 0.7, ease: "power1.inOut" }, 4.1);
    tl.fromTo("#s2",
      { opacity: 0, filter: "blur(16px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "sine.inOut" },
      4.18);

    tl.from("#s2-kicker", { opacity: 0, duration: 0.35, ease: "sine.out" }, 4.36);
    tl.from("#s2-title", { x: -28, opacity: 0, duration: 0.5, ease: "power3.out" }, 4.46);
    tl.from("#s2 .col", { y: 22, opacity: 0, duration: 0.45, stagger: 0.1, ease: "power2.out" }, 4.58);
    tl.from("#s2-card", { scale: 0.96, opacity: 0, duration: 0.4, ease: "expo.out" }, 4.78);

    // beat-grid: negosiasi 6.82s, deal 8.22s
    tl.to("#s2-card", { x: 568, duration: 0.42, ease: "power2.inOut" }, 6.82);
    tl.to("#s2-card", { x: 1136, duration: 0.42, ease: "power3.inOut" }, 8.22);

    tl.to("#s2", { opacity: 0, filter: "blur(16px)", duration: 0.65, ease: "power1.inOut" }, 9.83);
    tl.fromTo("#s3",
      { opacity: 0, filter: "blur(16px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.65, ease: "sine.inOut" },
      9.9);

    tl.from("#s3-kicker", { opacity: 0, duration: 0.3, ease: "sine.out" }, 10.08);
    tl.from("#s3-title", { y: -18, opacity: 0, duration: 0.45, ease: "power2.out" }, 10.16);
    tl.from("#s3 .col", { y: 18, opacity: 0, duration: 0.4, stagger: 0.08, ease: "power3.out" }, 10.28);
    tl.from("#s3-card", { x: -24, opacity: 0, duration: 0.4, ease: "expo.out" }, 10.42);

    // beat-grid: jahit 11.47s, qc 12.56s, selesai 13.64s
    tl.to("#s3-card", { x: 426, duration: 0.4, ease: "power2.inOut" }, 11.47);
    tl.to("#s3-card", { x: 852, duration: 0.4, ease: "power3.inOut" }, 12.56);
    tl.to("#s3-card", { x: 1278, duration: 0.4, ease: "power2.inOut" }, 13.64);

    // beat-locked: 15.82s
    tl.to("#s3-done", { backgroundColor: "#e0fce5", borderColor: "#096a33", duration: 0.35, ease: "power1.out" }, 15.82);
    tl.to("#s3-done-label", { color: "#104020", duration: 0.35, ease: "sine.out" }, 15.82);

    tl.to("#s3", { opacity: 0, filter: "blur(16px)", duration: 0.7, ease: "power1.inOut" }, 16.38);
    tl.fromTo("#s4",
      { opacity: 0, filter: "blur(16px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "sine.inOut" },
      16.46);

    tl.from("#s4-eye", { y: 14, opacity: 0, duration: 0.4, ease: "power2.out" }, 16.62);
    tl.from("#s4-mark", { y: 30, opacity: 0, duration: 0.6, ease: "expo.out" }, 17.15);
    tl.from("#s4-line1", { x: -20, opacity: 0, duration: 0.45, ease: "power3.out" }, 17.5);
    // beat-locked: 18.01s
    tl.from("#s4-line2", { x: 20, opacity: 0, duration: 0.5, ease: "sine.out" }, 18.01);

    tl.to("#s4", { opacity: 0, duration: 0.55, ease: "power1.in" }, 20.35);
    tl.to("#glow", { opacity: 0, duration: 0.55, ease: "power1.in" }, 20.35);

    window.__timelines["brag"] = tl;
  </script>
</body>
</html>
